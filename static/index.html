<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Jazz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="stage">
    <header class="brand">
      <p class="eyebrow">Jazz piano knowledge base</p>
      <h1>RAG Jazz</h1>
      <p class="lede">Ask a theory question. Get an answer grounded in Wikipedia source passages.</p>
    </header>

    <form id="ask-form" class="ask" autocomplete="off">
      <label class="sr-only" for="question">Question</label>
      <textarea
        id="question"
        name="question"
        rows="3"
        maxlength="500"
        placeholder="What is a tritone substitution?"
        required
      ></textarea>
      <div class="ask-row">
        <button type="submit" id="ask-btn">Ask</button>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </form>

    <div class="examples" aria-label="Example questions">
      <button type="button" data-q="What is a tritone substitution?">Tritone substitution</button>
      <button type="button" data-q="How does stride piano differ from boogie-woogie?">Stride vs boogie</button>
      <button type="button" data-q="Explain the ii-V-I progression">ii–V–I</button>
      <button type="button" data-q="What is modal jazz?">Modal jazz</button>
    </div>

    <section id="result" class="result" hidden>
      <p id="notice" class="notice" hidden></p>
      <article id="answer-card" class="answer" hidden>
        <h2>Answer</h2>
        <div id="answer"></div>
      </article>
      <article class="sources-block">
        <h2>Sources</h2>
        <ul id="sources"></ul>
      </article>
      <article class="passages-block">
        <h2>Matching passages</h2>
        <div id="chunks"></div>
      </article>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
